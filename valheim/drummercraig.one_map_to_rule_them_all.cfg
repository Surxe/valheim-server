## Settings file was created by plugin One Map To Rule Them All v2.8.1
## Plugin GUID: drummercraig.one_map_to_rule_them_all

[Client]

## Set to true to reset ALL client settings to their default values. Resets itself to false automatically.
# Setting type: Boolean
# Default value: false
_ResetToDefaults = false

## Show map pins created by other players on your minimap.
# Setting type: Boolean
# Default value: true
ShowOtherPlayerPins = true

## Local visibility master for auto-pins. When off, this client shows NO auto-pins (they are still generated and shared for other players); when on, the per-object Client.<Biome> toggles decide which show. Purely local — does not affect other players.
# Setting type: Boolean
# Default value: true
AutoPin = true

## Master client switch for the radar feature. Effective gate is (Server._Global.Radar AND Client.Radar). Turn this off to disable radar entirely on this client even when the server allows it. Radar pins are always client-only — never sent to other players.
# Setting type: Boolean
# Default value: true
Radar = true

## How often (seconds) batched exploration cells are sent to the server. Range: 0.1–5.0.
# Setting type: Single
# Default value: 1
ExploreFlushInterval = 1

## Seconds allowed per attempt for pre-rendering map-pin icons for modded creatures that have no item icon of their own. Rendering costs ~11 ms per object, so a typical set is ~2 s ONCE per mod version — later loads reuse the PNG cache and cost almost nothing. Anything not finished in time is rendered later on first sighting instead, so lowering this only delays icons. Set to 0 to disable pre-rendering entirely. Range: 0–5.
# Setting type: Single
# Default value: 3
IconPrewarmBudget = 3

## Seconds to wait after entering a world before pre-rendering icons. This is a correctness delay, not a performance one: mods whose shaders lack a variant for your graphics backend render as flat pink until a shader-fixup mod repairs them, and that repair is still running at world load. Rendering too early would photograph the pink. A bad render is now detected and retried rather than cached, so raising this only reduces wasted attempts. Raise it if icons come out pink. Range: 0–120.
# Setting type: Single
# Default value: 20
IconPrewarmSettleSeconds = 20

## How many times to attempt pre-rendering before leaving the rest to be rendered on first sighting. More than one is needed because the shader repair above belongs to another mod and gives no signal when it has finished. Retries are cheap: work already done is skipped. Range: 1–20.
# Setting type: Int32
# Default value: 5
IconPrewarmAttempts = 5

## How often (seconds) proximity and radar watchers check for nearby objects. Default 1.0 — at running speed a player covers ~5 m per second, so a 1 Hz check still trips every detection radius. Lower this only if you want pins to appear instantly the moment you cross a boundary; higher values reduce per-frame CPU. Range: 0.05–5.0.
# Setting type: Single
# Default value: 1
UpdateThrottleInterval = 1

## How often (seconds) discovery pin icons are reapplied after Valheim's per-frame icon reset. Default 1.0 — high enough that the per-frame restamp work is negligible but low enough that a freshly-opened map has correct icons within one tick. Lower values (down to 0 = every frame) restamp more aggressively but cost CPU. Range: 0–5.0.
# Setting type: Single
# Default value: 1
DiscoveryIconInterval = 1

## Minimum time (seconds) before re-running the nearby-object Physics query for an already-discovered pin. Prevents redundant OverlapSphere calls when the player oscillates near a detection boundary. Higher values reduce Physics overhead; lower values keep resource counts fresher. Range: 1–120.
# Setting type: Single
# Default value: 10
QuantityRecountInterval = 10

## Replace the standard pin icon on discovery pins with the item sprite from ObjectDB. Client-only — does not affect other players.
# Setting type: Boolean
# Default value: true
AutoPinObjectIcon = true

## Master switch for text on auto-discovery pins. When false, no abbreviation or count is shown regardless of the two AutoPinHide* settings below. Client-only — does not affect other players.
# Setting type: Boolean
# Default value: true
AutoPinText = true

## Hide the abbreviation on discovery pins that show a real item sprite, leaving just the count (e.g. '5' instead of 'Cu 5'). Applies ONLY to pins that actually have a sprite: a pin with no sprite renders as a plain dot, so it always keeps its abbreviation and count rather than becoming unidentifiable. Requires AutoPinText and AutoPinObjectIcon. Client-only — does not affect other players.
# Setting type: Boolean
# Default value: true
AutoPinHideTextIfIcon = true

## Hide the object count on discovery pins that show a real item sprite (e.g. 'Cu' instead of 'Cu 5'). Same sprite-only condition as AutoPinHideTextIfIcon. Set both to true for icon-only pins. Requires AutoPinText and AutoPinObjectIcon. Client-only — does not affect other players.
# Setting type: Boolean
# Default value: true
AutoPinHideCountIfIcon = true

## Draw map pin labels as written instead of Valheim's default ALL CAPS, so 'CopperVein' reads as CopperVein rather than COPPERVEIN. Valheim's pin font only has uppercase glyphs, so this switches pin labels to the game's mixed-case body font (a slightly plainer look). Affects every label on your map. Cosmetic, client-side, takes effect on the next map open.
# Setting type: Boolean
# Default value: true
PinLabelPreserveCase = true

## Size of the corner minimap, as a multiple of Valheim's default. 1.0 is untouched vanilla. The panel grows down and left with the screen corner pinned, and pins stay on their landmarks. NOTE: this magnifies the map image rather than adding detail — the minimap draws a fixed-size crop of the map texture chosen by ZOOM, so a bigger panel looks bigger but BLOCKIER; scroll-zoom for detail. Pin labels and the biome text do not grow with the panel. At 3.0 the panel covers much of the screen height, including the hotbar and health bars. Cosmetic and client-side: nothing is sent to other players. Applies immediately.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 1 to 3
MinimapScale = 1

## Size of pin icons on the CORNER minimap, as a multiple of Valheim's default (1.0 = untouched). Below 1.0 declutters a busy map; above 1.0 makes pins easier to pick out at a glance. The full-screen map is not affected. Cosmetic and client-side. Takes effect as the map next repaints.
# Setting type: Single
# Default value: 1
# Acceptable value range: From 0.5 to 3
MinimapPinSize = 1

## Master switch for text on radar pins. When false, no abbreviation or count is shown regardless of the two RadarHide* settings below.
# Setting type: Boolean
# Default value: true
RadarPinText = true

## Hide the abbreviation on radar pins that show a real item sprite, leaving just the count. Applies ONLY to pins that actually have a sprite: a pin with no sprite renders as a plain dot, so it always keeps its abbreviation and count rather than becoming unidentifiable. Requires RadarPinText. Client-side.
# Setting type: Boolean
# Default value: true
RadarHideTextIfIcon = true

## Hide the object count on radar pins that show a real item sprite. Same sprite-only condition as RadarHideTextIfIcon. Set both to true for icon-only radar pins. Requires RadarPinText. Client-side.
# Setting type: Boolean
# Default value: true
RadarHideCountIfIcon = true

## Radius in meters within which nearby radar pins of the same type merge into a single pin with a count label. Applies to ALL radar objects (creatures, pickables, ores, locations). Set to 0 for one pin per object (no clustering). Range: 0–150. Client-side.
# Setting type: Single
# Default value: 24
RadarClusterRadius = 24

