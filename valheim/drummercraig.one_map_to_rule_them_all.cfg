[Server._Diagnostics]

## Diagnostic toggle. When true, the mod logs a single line every time the local frame time exceeds StutterThresholdMs, listing how many mod hot-path operations ran in that frame. If every counter is zero on a stutter line, Valheim itself stalled and the mod was idle. Default false — this is a one-shot debugging tool.
# Setting type: Boolean
# Default value: false
1. StutterMonitorEnabled = false

## Stutter threshold in milliseconds. Frames with unscaledDeltaTime greater than this value are reported by the monitor when StutterMonitorEnabled is true. 75 ms ≈ 13.3 fps instantaneous, low enough to catch noticeable hitches without flooding the log on a low-end machine that runs steadily at ~30 fps. Range: 16–500.
# Setting type: Single
# Default value: 75
2. StutterThresholdMs = 75

## Maximum number of mod tracker ticks (ProximityWatcher + RadarPinComponent combined) that may run their EXPENSIVE work in a single frame. A tick that finds nothing to do (player out of range, or already handled) is not charged against this cap. Anything past the cap defers to the next frame and retries there. Caps the worst-case stutter that occurs when many trackers happen to align on a recovery frame after a Valheim-side stall. 32 leaves headroom on a steady-state ~60fps frame budget; lower values tighten the cap (smoother but slower drain), higher values loosen it (faster drain but bigger spike). Range: 4–512.
# Setting type: Int32
# Default value: 32
3. MaxTrackerTicksPerFrame = 32

[Server._Global]

## Set to true to reset ALL server settings to their default values. Resets itself to false automatically.
# Setting type: Boolean
# Default value: false
1. ResetToDefaults = false

## Master switch for the Shared Map Exploration feature (fog-of-war + player-pin sync). When false, each client runs map state local-only.
# Setting type: Boolean
# Default value: true
2. SharedMap = true

## Master switch for the automatic discovery-pin system.
# Setting type: Boolean
# Default value: true
3. AutoPin = true

## Map clutter: how aggressively nearby same-type objects merge into a single counted pin. MostPins merges least (pickable 8m), FewestPins merges most (32m); ModeratePins is 24m. Independent of the AutoPin detection distances — raising those no longer widens clustering. The 32m top end is deliberate: it keeps every distance/density combination inside the range where object counts can actually be measured, so a pin's count never goes stale.
# Setting type: PinDensity
# Default value: FewestPins
# Acceptable values: MostPins, MorePins, ModeratePins, FewerPins, FewestPins
4. PinDensity = FewestPins

## Master switch for the radar system. Radar pins are transient and client-only.
# Setting type: Boolean
# Default value: true
5. Radar = false

## When true, server admins may right-click-delete ANY player's map pin, not just their own. When false (default), admins can only delete their own player pins (and auto-discovery pins, which are always admin-managed).
# Setting type: Boolean
# Default value: false
6. AdminDeletePlayerPins = false

## When true, no auto-discovery pins are placed within AutoPinPreventionRadius of any player's '@' prevention pin. A prevention pin is a player pin whose name starts with '@'. Keeps a base area free of clutter.
# Setting type: Boolean
# Default value: true
7. AutoPinPrevention = true

## When true, radar pins are not displayed within RadarPreventionRadius of any player's '@' prevention pin.
# Setting type: Boolean
# Default value: true
8. RadarPrevention = true

## When true (default), every player's map position is shared with everyone and cannot be turned off, so all players are always visible on the map.
# Setting type: Boolean
# Default value: true
9. ForcePlayerVisibility = true

## When true (default), a pin is deleted for everyone once the object it marks is gone for good, instead of only being crossed off. Applies to things that never come back: mineable deposits — tin, copper, obsidian, silver and the Mistlands remains — and FELLED TREES, since a chopped tree does not regrow. Berry bushes and other pickables do regrow, so they are only ever crossed off. Deletion is authorised by the SERVER checking its own world data for anything remaining near the pin, not by trusting the player's client, so it is safe for non-admin players to mine a deposit out or clear a grove and have the pin disappear. If the server still sees one there it refuses, and the pin is crossed off instead. Turn this OFF to keep every pin on the map permanently, crossed off rather than removed.
# Setting type: Boolean
# Default value: true
10. RemoveMinedOutPins = true

[Server._Radius]

## How close (m) the player must be to a creature for its radar pin to appear. Max 150.
# Setting type: Single
# Default value: 75
1. CreatureRadar = 75

## How close the player must approach a location to trigger a permanent discovery pin. Closest=6m, Closer=12m, Midrange=20m, Farther=40m, Farthest=64m. Locations are large, so this defaults higher than ore/pickable. 64m is the top value on purpose: objects only exist once their zone streams in (~128m), so a larger radius would pin them the instant they load rather than when you approach.
# Setting type: AutoPinDistance
# Default value: Midrange
# Acceptable values: Closest, Closer, Midrange, Farther, Farthest
2. LocationAutoPin = Closer

## How close (m) the player must be to a location for its radar pin to appear. Max 150.
# Setting type: Single
# Default value: 75
3. LocationRadar = 75

## How close the player must approach an ore deposit to trigger a permanent discovery pin. Closest=6m, Closer=12m, Midrange=20m, Farther=40m, Farthest=64m.
# Setting type: AutoPinDistance
# Default value: Closer
# Acceptable values: Closest, Closer, Midrange, Farther, Farthest
4. OreAutoPin = Closest

## How close (m) the player must be to an ore deposit for its radar pin to appear. Max 150.
# Setting type: Single
# Default value: 75
5. OreRadar = 75

## How close the player must approach a pickable to trigger a permanent discovery pin. Closest=6m, Closer=12m, Midrange=20m, Farther=40m, Farthest=64m.
# Setting type: AutoPinDistance
# Default value: Closer
# Acceptable values: Closest, Closer, Midrange, Farther, Farthest
6. PickableAutoPin = Closest

## How close (m) the player must be to a pickable for its radar pin to appear. Max 150.
# Setting type: Single
# Default value: 75
7. PickableRadar = 75

## Radius (m) around a player's '@' prevention pin within which auto-discovery pins are suppressed (when AutoPinPrevention is on). Max 150.
# Setting type: Single
# Default value: 50
8. AutoPinPreventionRadius = 50

## Radius (m) around a player's '@' prevention pin within which radar pins are suppressed (when RadarPrevention is on). Max 150.
# Setting type: Single
# Default value: 50
9. RadarPreventionRadius = 50

