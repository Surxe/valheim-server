## InventoryActions (sighsorry) - SERVER-SYNCED settings only. Checked in and copied to the VM's
## BepInEx config dir by stage-mods.sh; the server pushes [1 - General] to every client (ServerSync).
## The other sections are per-client and are regenerated with defaults on the server, where they
## do nothing.

[1 - General]

## When enabled, only server admins can modify this mod's synced configuration. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Lock Configuration = On

## When enabled, shows a trash panel below the player inventory. Dropping a held player-inventory item on it opens a confirmation dialog before deleting the held amount. [Synced with Server]
# Setting type: Toggle
# Default value: On
# Acceptable values: Off, On
Enable Inventory Trash Panel = On

## Range in meters for hover Area Quick Stack. Set to 0 to disable area quick stack. The opened-container Place stacks button only uses the current container. [Synced with Server]
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 50
Area Quick Stack Range = 10

## Range in meters for hover Area Take Stacks. Set to 0 to disable area take stacks. The opened-container Take stacks button only uses the current container. [Synced with Server]
## SET TO 0 (2026-10-12, Ethan): hold Alt+E favorite restock must not pull from nearby chests.
## This is the only server-side lever on restock: per the mod's user guide a range of 0 removes
## the NEARBY portion only - Alt+E still refills from the one chest being looked at. Unbinding it
## entirely is the per-client `Container Restock Key` ([2 - Client], not synced).
# Setting type: Single
# Default value: 10
# Acceptable value range: From 0 to 50
Area Take Stacks Range = 0
